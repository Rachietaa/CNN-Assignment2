# Experiment 4b — DINO (teacher) encoder, fully fine-tuned with labels.
# Identical to the supervised baseline (configs/sup_resnet18.yaml) except the starting weights,
# so any difference is caused by the SSL pretraining.
name: ft_dino
seed: 0

init:
  encoder: runs/dino/encoder.pt

data:
  root: data
  img_size: 128
  num_workers: 4
  augment:
    random_resized_crop: [0.7, 1.0]
    hflip: 0.5
    rotation: 10
    brightness: 0.2
    contrast: 0.2

model:
  name: resnet18
  dropout: 0.0

train:
  batch_size: 64
  epochs: 100
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
