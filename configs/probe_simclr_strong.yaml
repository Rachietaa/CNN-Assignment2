# Experiment 2a — Linear probe: frozen SimCLR encoder + new linear layer (8,208 trainable weights).
# Measures how linearly separable the self-supervised features are, without changing them.
name: probe_simclr_strong
seed: 0

init:
  encoder: runs/simclr_strong/encoder.pt

data:
  root: data
  img_size: 128
  num_workers: 4
  augment:
    random_resized_crop: [0.7, 1.0]
    hflip: 0.5
    rotation: 10
    brightness: 0.2
    contrast: 0.2

model:
  name: resnet18
  dropout: 0.0

train:
  freeze_encoder: true
  batch_size: 64
  epochs: 100
  lr: 0.001
  weight_decay: 0.0
  warmup_epochs: 0
